name: Refresh dashboard data

on:
  schedule:
    # 07:00 UTC nightly (~3am ET). Offset from Greater-Newburyport (06:30)
    # so they don't both hit MLSPIN at the same minute.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the commit step can rebase onto an advanced main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Refresh MLSPIN data
        env:
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
        run: |
          if [ -z "$BRIDGE_TOKEN" ]; then
            echo "::warning::BRIDGE_TOKEN secret not set — skipping refresh."
            echo "Add it at Settings → Secrets and variables → Actions."
            exit 0
          fi
          printf 'BRIDGE_TOKEN=%s\nBRIDGE_DATASET=mlspin\nFUB_API_KEY=%s\n' "$BRIDGE_TOKEN" "$FUB_API_KEY" > .env
          # dashboard.json is the primary artifact — keep it fatal.
          node pipelines/fetch_dashboard.js
          # The secondary feeds are independent JSON files consumed by other
          # embeds. Don't let a transient failure in one (e.g. an API rate
          # limit) abort the whole step and block committing the others.
          node pipelines/fetch_market_leader.js || echo "::warning::market-leader refresh failed; continuing with last-good market-leader.json."
          node pipelines/fetch_agent_map.js || echo "::warning::agent-map refresh failed; continuing with last-good agent-map.json."
          if [ -n "$FUB_API_KEY" ]; then
            node pipelines/fetch_fub.js || echo "::warning::FUB pull failed; continuing."
          else
            echo "::warning::FUB_API_KEY secret not set — skipping FUB pull."
          fi
          rm .env

      - name: Commit + push if data changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/dashboard.json data/processed/market-leader.json data/processed/agent-map.json data/processed/fub-stats.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            STAMP=$(date -u +'%Y-%m-%d')
            git commit -m "chore(data): weekly refresh ${STAMP}"
            # The remote main can advance while this run is in flight (a manual
            # commit, or an overlapping run). Rebase our data commit on top of
            # the latest main and retry the push instead of failing outright.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              echo "push attempt ${attempt} rejected; re-fetching and retrying..."
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push data refresh after 3 attempts"
              exit 1
            fi
          fi
