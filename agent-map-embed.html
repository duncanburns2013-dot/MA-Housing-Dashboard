<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
/* Outer stage — full-bleed background. Breaks out of Squarespace's
   content-width constraint to span the entire viewport horizontally
   so the navy gradient fills the page instead of acting as a border. */
#am-stage {
  position: relative;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  padding: 56px 24px;
  background:
    radial-gradient(ellipse at 18% 22%, rgba(201,235,252,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 82% 78%, rgba(212,175,55,0.07) 0%, transparent 55%),
    linear-gradient(135deg, #0a1929 0%, #14264a 35%, #1e335e 50%, #14264a 65%, #0a1929 100%);
  overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
#am-stage::before, #am-stage::after {
  content: ''; position: absolute; border-radius: 50%;
  filter: blur(80px); pointer-events: none; opacity: 0.5;
}
#am-stage::before {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(201,235,252,0.25), transparent 70%);
  top: -120px; left: 8%;
}
#am-stage::after {
  width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(212,175,55,0.18), transparent 70%);
  bottom: -100px; right: 10%;
}
#am-stage > * { position: relative; z-index: 1; }

#am-root {
  --navy: #1e335e;
  --navy-2: #2a4a82;
  --cyan: #c9ebfc;
  --gold: #d4af37;
  --coral: #ff7560;
  --bg: #fafbfc;
  --ink: #1e335e;
  --ink-mute: #6b7280;
  --ink-soft: #9ca3af;
  --border: #e5e7eb;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--bg);
  border-radius: 18px;
  overflow: hidden;
  max-width: 1200px;
  margin: 0 auto;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 30px 80px rgba(0,0,0,0.45),
    0 12px 30px rgba(0,0,0,0.25),
    0 0 0 1px rgba(201,235,252,0.04);
}
#am-root * { box-sizing: border-box; }

/* Header */
#am-root .am-header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 28px;
  align-items: center;
  padding: 32px 36px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
  color: #fff;
  position: relative;
  overflow: hidden;
}
#am-root .am-header::before {
  content: ''; position: absolute; top: -150px; right: -150px;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,235,252,0.18) 0%, transparent 60%);
  pointer-events: none;
}
#am-root .am-header::after {
  content: ''; position: absolute; bottom: -100px; left: 30%;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 65%);
  pointer-events: none;
}
#am-root .am-photo {
  width: 96px; height: 96px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 3px solid var(--cyan);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25), 0 0 0 6px rgba(201,235,252,0.1);
  background-color: var(--navy-2);
  position: relative; z-index: 1;
}
#am-root .am-name {
  font-family: 'Playfair Display', serif;
  font-size: 32px; font-weight: 700; line-height: 1.05;
  margin: 0; color: #fff !important; letter-spacing: -0.5px;
  position: relative; z-index: 1;
}
#am-root .am-title {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--cyan) !important; opacity: 0.85; margin-bottom: 4px;
  position: relative; z-index: 1;
}
#am-root .am-links {
  margin-top: 6px; display: flex; gap: 14px; font-size: 11px;
  position: relative; z-index: 1;
}
#am-root .am-links a {
  color: var(--cyan) !important; text-decoration: none;
  border-bottom: 1px solid rgba(201,235,252,0.3);
  transition: border-color 0.15s;
}
#am-root .am-links a:hover { border-color: var(--cyan); }
#am-root .am-stats {
  display: flex; gap: 28px;
  position: relative; z-index: 1;
}
#am-root .am-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 26px; font-weight: 700; line-height: 1; color: #fff !important;
  transition: opacity 0.2s, transform 0.2s;
}
#am-root .am-stat-val.flash { animation: amFlash 0.5s ease; }
@keyframes amFlash {
  0% { opacity: 0.4; transform: translateY(-3px); }
  50% { opacity: 1; transform: translateY(0); color: var(--cyan); }
  100% { opacity: 1; transform: translateY(0); }
}
#am-root .am-stat-lbl {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--cyan) !important; opacity: 0.8; margin-top: 6px;
}

/* Filter bar */
#am-root .am-filters {
  display: flex; gap: 12px; align-items: center;
  padding: 16px 32px; background: #fff;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
#am-root .am-filter-label {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-mute); font-weight: 600;
}
#am-root .am-select {
  appearance: none;
  padding: 9px 32px 9px 14px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--ink);
  background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M3 5l3 3 3-3" stroke="%231e335e" stroke-width="1.5" fill="none"/></svg>') no-repeat right 10px center;
  background-size: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#am-root .am-select:hover, #am-root .am-select:focus {
  border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(30,51,94,0.08);
}
#am-root .am-toggle-group {
  display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
#am-root .am-toggle {
  padding: 9px 14px; font-family: inherit; font-size: 12px; font-weight: 500;
  background: #fff; color: var(--ink-mute); border: none; cursor: pointer;
  transition: all 0.15s;
}
#am-root .am-toggle + .am-toggle { border-left: 1px solid var(--border); }
#am-root .am-toggle:hover { background: #f5f7fa; color: var(--ink); }
#am-root .am-toggle.active { background: var(--navy); color: #fff; }
#am-root .am-search {
  flex: 0 1 220px; min-width: 140px;
  padding: 9px 14px 9px 34px;
  font-family: inherit; font-size: 13px;
  border: 1px solid var(--border); border-radius: 8px;
  background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" stroke="%236b7280" stroke-width="1.5" fill="none"/><path d="M11 11l3 3" stroke="%236b7280" stroke-width="1.5"/></svg>') no-repeat 10px center;
  background-size: 14px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#am-root .am-search:focus {
  border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(30,51,94,0.08);
}
#am-root .am-play {
  padding: 9px 14px; font-family: inherit; font-size: 12px; font-weight: 500;
  background: var(--gold); color: #fff; border: none; border-radius: 8px;
  cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
#am-root .am-play:hover { background: #b8932e; }
#am-root .am-play.playing { background: var(--coral); }
#am-root .am-play svg { width: 12px; height: 12px; fill: currentColor; }
#am-root .am-spacer { flex: 1; }
#am-root .am-legend {
  display: flex; gap: 18px; align-items: center;
  font-size: 11px; color: var(--ink-mute);
}
#am-root .am-legend-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
#am-root .am-legend-dot.list { background: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,0.2); }
#am-root .am-legend-dot.buy  { background: var(--navy); box-shadow: 0 0 0 2px rgba(30,51,94,0.2); }
#am-root .am-legend-dot.lux  {
  background: linear-gradient(135deg, var(--coral), #d4574a);
  box-shadow: 0 0 0 2px rgba(255,117,96,0.25), 0 0 8px rgba(255,117,96,0.5);
}

/* Map */
#am-map { height: 680px; width: 100%; background: #e8eef5; position: relative; }
#am-root .maplibregl-popup-content {
  padding: 0; border-radius: 12px; overflow: hidden;
  box-shadow: 0 16px 40px rgba(30,51,94,0.22);
  min-width: 250px; max-width: 280px;
}
#am-root .maplibregl-popup-tip { border-top-color: #fff !important; filter: drop-shadow(0 4px 6px rgba(30,51,94,0.08)); }
#am-root .maplibregl-popup-close-button {
  color: #fff; font-size: 20px; padding: 4px 8px; font-weight: 300;
}
#am-root .maplibregl-ctrl-attrib { font-size: 10px; opacity: 0.7; }
#am-root .maplibregl-ctrl-group { box-shadow: 0 2px 8px rgba(30,51,94,0.15); border-radius: 8px; overflow: hidden; }
#am-root .maplibregl-ctrl-group button { width: 32px; height: 32px; }

#am-root .am-pop {
  background: #fff;
  animation: amPopIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes amPopIn {
  from { opacity: 0; transform: translateY(6px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
#am-root .am-pop-header {
  display: grid; grid-template-columns: 40px 1fr;
  gap: 10px; padding: 12px 14px 10px;
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: #fff;
}
#am-root .am-pop.lux .am-pop-header {
  background: linear-gradient(135deg, var(--coral), #d4574a);
}
#am-root .am-pop-photo {
  width: 40px; height: 40px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 2px solid var(--cyan); background-color: var(--navy-2);
}
#am-root .am-pop.lux .am-pop-photo { border-color: rgba(255,255,255,0.5); }
#am-root .am-pop-agent {
  font-size: 13px; font-weight: 600; line-height: 1.2;
  color: #fff !important; margin: 0;
}
#am-root .am-pop-side {
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--cyan) !important; opacity: 0.95; margin-top: 3px;
}
#am-root .am-pop.lux .am-pop-side { color: #fff !important; }
#am-root .am-pop-body { padding: 13px 16px 14px; }
#am-root .am-pop-addr {
  font-size: 13px; font-weight: 500; line-height: 1.3;
  color: var(--ink); margin-bottom: 6px;
}
#am-root .am-pop-price {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700; color: var(--ink);
}
#am-root .am-pop.lux .am-pop-price {
  color: var(--coral); text-shadow: 0 0 14px rgba(255,117,96,0.35);
}
#am-root .am-pop-meta {
  font-size: 11px; color: var(--ink-mute); margin-top: 6px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
#am-root .am-pop-meta span:not(:last-child)::after {
  content: '·'; margin-left: 8px; color: var(--ink-soft);
}
#am-root .am-pop-link {
  display: inline-block; margin-top: 10px;
  font-size: 11px; color: var(--navy); text-decoration: none;
  border-bottom: 1px solid var(--cyan);
  transition: color 0.15s, border-color 0.15s;
}
#am-root .am-pop-link:hover { color: var(--coral); border-color: var(--coral); }

/* Year timeline at bottom of map */
#am-root .am-timeline {
  padding: 10px 32px 14px;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-end; gap: 4px;
  height: 76px; position: relative;
}
#am-root .am-tl-bar {
  flex: 1; background: linear-gradient(180deg, var(--cyan), rgba(201,235,252,0.5));
  border-radius: 4px 4px 0 0;
  min-height: 6px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
#am-root .am-tl-bar:hover {
  background: linear-gradient(180deg, var(--gold), rgba(212,175,55,0.4));
  transform: translateY(-2px);
}
#am-root .am-tl-bar.active {
  background: linear-gradient(180deg, var(--navy), var(--navy-2));
  box-shadow: 0 -4px 14px rgba(30,51,94,0.25);
}
#am-root .am-tl-year {
  position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 600; color: var(--ink-mute);
  letter-spacing: 0.05em;
}
#am-root .am-tl-bar.active .am-tl-year { color: var(--navy); font-weight: 700; }
#am-root .am-tl-count {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 700; color: var(--ink);
  opacity: 0; transition: opacity 0.2s;
}
#am-root .am-tl-bar:hover .am-tl-count { opacity: 1; }

/* Footer */
#am-root .am-foot {
  padding: 14px 32px; background: #fff;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--ink-mute);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
#am-root .am-foot a { color: var(--navy); text-decoration: none; }
#am-root .am-foot a:hover { color: var(--coral); }
#am-root .am-loading {
  display: flex; align-items: center; justify-content: center;
  height: 680px; color: var(--ink-mute); font-size: 14px;
  background: linear-gradient(135deg, #f0f4f9, #e8eef5);
}

@media (max-width: 768px) {
  #am-stage { padding: 28px 14px; }
  #am-root { border-radius: 12px; }
  #am-root .am-header { grid-template-columns: 72px 1fr; padding: 24px 22px; gap: 16px; }
  #am-root .am-photo { width: 72px; height: 72px; }
  #am-root .am-name { font-size: 24px; }
  #am-root .am-stats { grid-column: 1 / -1; gap: 16px; margin-top: 10px; }
  #am-root .am-stat-val { font-size: 20px; }
  #am-root .am-filters { padding: 12px 18px; gap: 8px; }
  #am-root .am-search { flex: 1 1 100%; }
  #am-root .am-legend { display: none; }
  #am-map { height: 520px; }
  #am-root .am-timeline { padding: 10px 18px 14px; }
  #am-root .am-foot { padding: 12px 18px; font-size: 10px; }
}
</style>

<div id="am-stage">
<div id="am-root">
  <div class="am-header">
    <div class="am-photo" id="am-photo"></div>
    <div>
      <div class="am-title" id="am-title">REALTOR®</div>
      <h2 class="am-name" id="am-name">Loading…</h2>
      <div class="am-links" id="am-links"></div>
    </div>
    <div class="am-stats" id="am-stats"></div>
  </div>

  <div class="am-filters">
    <span class="am-filter-label">Year</span>
    <select class="am-select" id="am-year"><option value="all">All Years</option></select>
    <button class="am-play" id="am-play" title="Play time-lapse"><svg viewBox="0 0 12 12"><polygon points="2,1 11,6 2,11"/></svg>Play</button>

      <button class="am-toggle active" data-side="all">All</button>

<script>
(function(){
var DATA_URL = 'https://duncanburns2013-dot.github.io/MA-Housing-Dashboard/data/processed/agent-map.json';
var REPO_BASE = 'https://duncanburns2013-dot.github.io/MA-Housing-Dashboard/';

function fmtMoney(v) {
  if (v == null) return '—';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  return '$' + Math.round(v/1000) + 'K';
}
function fmtMoneyFull(v) { return '$' + Math.round(v).toLocaleString(); }
function fmtDate(s) {
  var d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}

var state = {
  data: null,
  filterYear: 'all',
  filterSide: 'all',
  filterText: '',
  view: 'pins',
  map: null,
  popup: null,
  playing: false,
  playTimer: null
};

function getAgent(id) { return state.data.agents.find(function(a){ return a.mlsId === id; }); }

function filteredSales() {
  var q = state.filterText.toLowerCase().trim();
  return state.data.sales.filter(function(s) {
    if (state.filterYear !== 'all' && s.year !== state.filterYear) return false;
    if (state.filterSide !== 'all' && s.side !== state.filterSide) return false;
    if (q) {
      var hay = ((s.address || '') + ' ' + (s.city || '') + ' ' + (s.state || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function flashStat(el) {
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function renderHeader() {
  var a = state.data.agents[0];
  if (!a) return;
  var photoUrl = a.photoUrl.indexOf('http') === 0 ? a.photoUrl : REPO_BASE + a.photoUrl;
  document.getElementById('am-photo').style.backgroundImage = 'url("' + photoUrl + '")';
  document.getElementById('am-name').textContent = a.name;
  document.getElementById('am-title').textContent = a.title || 'REALTOR®';

  var links = a.externalLinks || {};
  var linkHtml = '';
  if (links.zillowProfile) linkHtml += '<a href="' + links.zillowProfile + '" target="_blank" rel="noopener">View Zillow profile →</a>';
  if (links.bentleysBio) linkHtml += '<a href="' + links.bentleysBio + '" target="_blank" rel="noopener">Bentley\'s bio →</a>';
  document.getElementById('am-links').innerHTML = linkHtml;

  var filtered = filteredSales();
  var total = filtered.reduce(function(s,x){ return s + (x.price || 0); }, 0);
  var listCount = filtered.filter(function(x){return x.side === 'list'}).length;
  var buyCount = filtered.filter(function(x){return x.side === 'buy'}).length;
  document.getElementById('am-stats').innerHTML =
    '<div><div class="am-stat-val flash">' + filtered.length + '</div><div class="am-stat-lbl">Sales</div></div>' +
    '<div><div class="am-stat-val flash">' + fmtMoney(total) + '</div><div class="am-stat-lbl">Volume</div></div>' +
    '<div><div class="am-stat-val flash">' + listCount + '/' + buyCount + '</div><div class="am-stat-lbl">Sell / Buy</div></div>';
}

function popupHtml(s) {
  var a = getAgent(s.agentId);
  var photoUrl = a && a.photoUrl ? (a.photoUrl.indexOf('http') === 0 ? a.photoUrl : REPO_BASE + a.photoUrl) : '';
  var isLux = s.price >= 1000000;
  var sideLabel = s.side === 'list' ? 'Sell-side' : 'Buy-side';
  var meta = [];
  if (s.beds) meta.push(s.beds + ' bd');
  if (s.baths) meta.push(s.baths + ' ba');
  if (s.sqft) meta.push(s.sqft.toLocaleString() + ' sqft');
  if (s.subType) meta.push(s.subType);
  var mapsLink = 'https://www.google.com/maps?q=' + encodeURIComponent(s.address);
  return '<div class="am-pop' + (isLux ? ' lux' : '') + '">' +
    '<div class="am-pop-header">' +
      '<div class="am-pop-photo" style="background-image:url(\'' + photoUrl + '\')"></div>' +
      '<div>' +
        '<div class="am-pop-agent">' + (a ? a.name : 'Agent') + '</div>' +
        '<div class="am-pop-side">' + sideLabel + (isLux ? ' · Luxury' : '') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="am-pop-body">' +
      '<div class="am-pop-addr">' + s.address + '</div>' +
      '<div class="am-pop-price">' + fmtMoneyFull(s.price) + '</div>' +
      '<div class="am-pop-meta">' +
        '<span>' + fmtDate(s.date) + '</span>' +
        meta.map(function(m){return '<span>' + m + '</span>'}).join('') +
      '</div>' +
      '<a class="am-pop-link" href="' + mapsLink + '" target="_blank" rel="noopener">Open in Google Maps →</a>' +
    '</div>' +
  '</div>';
}

function buildSourceData() {
  var sales = filteredSales().filter(function(s){ return s.lat && s.lng; });
  return {
    type: 'FeatureCollection',
    features: sales.map(function(s, i) {
      return {
        type: 'Feature',
        id: i,
        geometry: { type: 'Point', coordinates: [s.lng, s.lat] },
        properties: {
          idx: i,
          side: s.side,
          price: s.price,
          isLux: s.price >= 1000000 ? 1 : 0,
          // Pin radius scales by price: $250K→5, $1M→9, $3M→13
          radius: Math.max(5, Math.min(14, 5 + Math.log10(s.price / 100000) * 3))
        }
      };
    }),
    __salesRef: sales
  };
}

function ensureMap() {
  if (state.map) return;
  document.getElementById('am-map').classList.remove('am-loading');
  document.getElementById('am-map').innerHTML = '';

  state.map = new maplibregl.Map({
    container: 'am-map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [-70.87, 42.81],
    zoom: 10,
    pitch: 0,
    attributionControl: { compact: true }
  });
  state.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
  state.map.scrollZoom.disable();

  state.map.on('load', function() {
    // GeoJSON source with clustering. Smaller radius keeps clusters from
    // spanning the Merrimack River (centroid would land in the water).
    state.map.addSource('sales', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] },
      cluster: true,
      clusterMaxZoom: 12,
      clusterRadius: 28
    });

    // Cluster halo
    state.map.addLayer({
      id: 'clusters-halo',
      type: 'circle',
      source: 'sales',
      filter: ['has', 'point_count'],
      paint: {
        'circle-color': 'rgba(30,51,94,0.18)',
        'circle-radius': ['step', ['get', 'point_count'], 28, 10, 34, 50, 42],
        'circle-blur': 0.4
      }
    });
    state.map.addLayer({
      id: 'clusters',
      type: 'circle',
      source: 'sales',
      filter: ['has', 'point_count'],
      paint: {
        'circle-color': '#1e335e',
        'circle-radius': ['step', ['get', 'point_count'], 18, 10, 24, 50, 32],
        'circle-stroke-width': 2,
        'circle-stroke-color': '#c9ebfc'
      }
    });
    state.map.addLayer({
      id: 'cluster-count',
      type: 'symbol',
      source: 'sales',
      filter: ['has', 'point_count'],
      layout: {
        'text-field': '{point_count_abbreviated}',
        'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
        'text-size': 13
      },
      paint: { 'text-color': '#ffffff' }
    });

    // Luxury halo (glow ring for $1M+)
    state.map.addLayer({
      id: 'lux-halo',
      type: 'circle',
      source: 'sales',
      filter: ['all', ['!', ['has', 'point_count']], ['==', ['get', 'isLux'], 1]],
      paint: {
        'circle-color': '#ff7560',
        'circle-radius': ['+', ['get', 'radius'], 6],
        'circle-blur': 0.7,
        'circle-opacity': 0.5
      }
    });
    // Sell-side pins (gold)
    state.map.addLayer({
      id: 'pins-list',
      type: 'circle',
      source: 'sales',
      filter: ['all', ['!', ['has', 'point_count']], ['==', ['get', 'side'], 'list']],
      paint: {
        'circle-color': [
          'case', ['==', ['get', 'isLux'], 1], '#ff7560', '#d4af37'
        ],
        'circle-radius': ['get', 'radius'],
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff',
        'circle-stroke-opacity': 0.95
      }
    });
    // Buy-side pins (navy)
    state.map.addLayer({
      id: 'pins-buy',
      type: 'circle',
      source: 'sales',
      filter: ['all', ['!', ['has', 'point_count']], ['==', ['get', 'side'], 'buy']],
      paint: {
        'circle-color': [
          'case', ['==', ['get', 'isLux'], 1], '#ff7560', '#1e335e'
        ],
        'circle-radius': ['get', 'radius'],
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff',
        'circle-stroke-opacity': 0.95
      }
    });
    // Heatmap layer (toggled visibility)
    state.map.addLayer({
      id: 'heat',
      type: 'heatmap',
      source: 'sales',
      paint: {
        'heatmap-weight': ['interpolate', ['linear'], ['get', 'price'], 0, 0, 5000000, 1],
        'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 8, 0.6, 14, 1.5],
        'heatmap-color': [
          'interpolate', ['linear'], ['heatmap-density'],
          0, 'rgba(30,51,94,0)',
          0.2, 'rgba(30,51,94,0.5)',
          0.4, 'rgba(201,235,252,0.7)',
          0.6, 'rgba(212,175,55,0.8)',
          0.8, 'rgba(255,117,96,0.9)',
          1, 'rgba(255,117,96,1)'
        ],
        'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 8, 22, 14, 50],
        'heatmap-opacity': 0
      }
    });

    // 3D buildings at high zoom (vector tiles include this data on Carto)
    var firstSymbolId;
    var layers = state.map.getStyle().layers;
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].type === 'symbol') { firstSymbolId = layers[i].id; break; }
    }

    // Cluster click → zoom in. MapLibre 4.x uses Promises (was callback in 3.x).
    state.map.on('click', 'clusters', function(e) {
      var f = state.map.queryRenderedFeatures(e.point, { layers: ['clusters'] })[0];
      if (!f) return;
      var src = state.map.getSource('sales');
      var result = src.getClusterExpansionZoom(f.id);
      // Support both Promise (4.x) and callback (3.x) APIs
      if (result && typeof result.then === 'function') {
        result.then(function(zoom) {
          state.map.easeTo({ center: f.geometry.coordinates, zoom: zoom + 0.5, duration: 700 });
        });
      } else {
        // Fall back to callback signature
        src.getClusterExpansionZoom(f.id, function(err, zoom) {
          if (err) return;
          state.map.easeTo({ center: f.geometry.coordinates, zoom: zoom + 0.5, duration: 700 });
        });
      }
    });
    state.map.on('mouseenter', 'clusters', function() { state.map.getCanvas().style.cursor = 'pointer'; });
    state.map.on('mouseleave', 'clusters', function() { state.map.getCanvas().style.cursor = ''; });

    // Pin click → popup
    ['pins-list', 'pins-buy'].forEach(function(layer) {
      state.map.on('click', layer, function(e) {
        var props = e.features[0].properties;
        var sales = state.map.getSource('sales')._data.__salesRef || [];
        var sale = sales[props.idx];
        if (!sale) return;
        if (state.popup) state.popup.remove();
        state.popup = new maplibregl.Popup({ offset: 14, closeButton: true, maxWidth: '320px' })
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(popupHtml(sale))
          .addTo(state.map);
      });
      state.map.on('mouseenter', layer, function() { state.map.getCanvas().style.cursor = 'pointer'; });
      state.map.on('mouseleave', layer, function() { state.map.getCanvas().style.cursor = ''; });
    });

    refreshSource();
    state.map._isReady = true;
  });
}

function refreshSource() {
  if (!state.map || !state.map.getSource('sales')) return;
  var data = buildSourceData();
  state.map.getSource('sales').setData(data);
  // Stash the original sales array on the source's _data so click handlers can resolve idx → sale
  state.map.getSource('sales')._data.__salesRef = data.__salesRef;

  // Toggle pins vs heatmap layer visibility
  var pinLayers = ['clusters-halo','clusters','cluster-count','lux-halo','pins-list','pins-buy'];
  pinLayers.forEach(function(id) {
    if (state.map.getLayer(id)) state.map.setLayoutProperty(id, 'visibility', state.view === 'pins' ? 'visible' : 'none');
  });
  if (state.map.getLayer('heat')) {
    state.map.setLayoutProperty('heat', 'visibility', state.view === 'heat' ? 'visible' : 'none');
    state.map.setPaintProperty('heat', 'heatmap-opacity', state.view === 'heat' ? 0.85 : 0);
  }

  // Auto-fit bounds
  var sales = data.features.map(function(f){ return f.geometry.coordinates; });
  if (sales.length) {
    var bounds = sales.reduce(function(b, c) { return b.extend(c); }, new maplibregl.LngLatBounds(sales[0], sales[0]));
    state.map.fitBounds(bounds, { padding: 60, maxZoom: 13, duration: 700 });
  }
}

function renderMap() {
  ensureMap();
  if (state.map._isReady) refreshSource();
  else state.map.once('load', refreshSource);
}

function renderTimeline() {
  var tl = document.getElementById('am-timeline');
  tl.innerHTML = '';
  var years = state.data.meta.years.slice().reverse(); // ascending
  // Build histogram (counts ignore side/text filter — represents full data baseline)
  var counts = years.map(function(y) {
    return state.data.sales.filter(function(s){ return s.year === y && (state.filterSide === 'all' || s.side === state.filterSide); }).length;
  });
  var maxC = Math.max.apply(null, counts.concat([1]));
  years.forEach(function(y, i) {
    var bar = document.createElement('div');
    bar.className = 'am-tl-bar' + (state.filterYear === y ? ' active' : '');
    var hPct = Math.max(8, (counts[i] / maxC) * 100);
    bar.style.height = hPct + '%';
    bar.innerHTML = '<span class="am-tl-count">' + counts[i] + '</span><span class="am-tl-year">' + (y.slice(2)) + '</span>';
    bar.addEventListener('click', function() {
      stopPlay();
      state.filterYear = state.filterYear === y ? 'all' : y;
      document.getElementById('am-year').value = state.filterYear;
      rerender();
    });
    tl.appendChild(bar);
  });
}

function renderFooter() {
  if (state.data.meta.generated) {
    var stamp = new Date(state.data.meta.generated).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    document.getElementById('am-foot-stamp').textContent = 'Updated ' + stamp;
  }
  var states = [...new Set(state.data.sales.map(function(s){return s.state}))];
  if (states.indexOf('NH') !== -1) {
    var zillowLink = state.data.agents[0]?.externalLinks?.zillowProfile;
    document.getElementById('am-foot-note').innerHTML = zillowLink
      ? 'For complete NH sales, see <a href="' + zillowLink + '" target="_blank" rel="noopener">Zillow profile</a>'
      : '';
  }
  var sales = filteredSales();
  var withGeo = sales.filter(function(s){return s.lat && s.lng}).length;
  document.getElementById('am-foot-counts').textContent = withGeo + ' of ' + sales.length + ' sales shown';
}

function rerender() { renderHeader(); renderMap(); renderTimeline(); renderFooter(); }

function setupFilters() {
  var yearSel = document.getElementById('am-year');
  state.data.meta.years.forEach(function(y) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  });
  yearSel.addEventListener('change', function() {
    stopPlay();
    state.filterYear = yearSel.value;
    rerender();
  });
  document.querySelectorAll('.am-toggle[data-side]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.am-toggle[data-side]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.filterSide = btn.dataset.side;
      rerender();
    });
  });
  document.querySelectorAll('.am-toggle[data-view]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.am-toggle[data-view]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.view = btn.dataset.view;
      rerender();
    });
  });
  var searchTimer = null;
  document.getElementById('am-search').addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    var val = e.target.value;
    searchTimer = setTimeout(function() {
      state.filterText = val;
      rerender();
    }, 200);
  });
  document.getElementById('am-play').addEventListener('click', togglePlay);
}

function togglePlay() { if (state.playing) stopPlay(); else startPlay(); }
function startPlay() {
  var years = state.data.meta.years.slice().reverse();
  if (!years.length) return;
  state.playing = true;
  var btn = document.getElementById('am-play');
  btn.classList.add('playing');
  btn.innerHTML = '<svg viewBox="0 0 12 12"><rect x="2" y="2" width="3" height="8"/><rect x="7" y="2" width="3" height="8"/></svg>Pause';
  var i = 0;
  function step() {
    if (!state.playing) return;
    var yr = years[i % years.length];
    document.getElementById('am-year').value = yr;
    state.filterYear = yr;
    rerender();
    i++;
    state.playTimer = setTimeout(step, 1500);
  }
  step();
}
function stopPlay() {
  state.playing = false;
  clearTimeout(state.playTimer);
  var btn = document.getElementById('am-play');
  btn.classList.remove('playing');
  btn.innerHTML = '<svg viewBox="0 0 12 12"><polygon points="2,1 11,6 2,11"/></svg>Play';
}

fetch(DATA_URL + '?t=' + Date.now())
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(data) {
    state.data = data;
    if (data.brand && data.brand.primary) {
      var r = document.getElementById('am-root');
      r.style.setProperty('--navy', data.brand.primary);
      if (data.brand.accent) r.style.setProperty('--cyan', data.brand.accent);
      if (data.brand.highlight) r.style.setProperty('--gold', data.brand.highlight);
      if (data.brand.luxury) r.style.setProperty('--coral', data.brand.luxury);
    }
    setupFilters();
    rerender();
  })
  .catch(function(e) {
    console.error('Agent map fetch failed:', e);
    document.getElementById('am-name').textContent = 'Map unavailable';
    document.getElementById('am-map').textContent = 'Live data could not load. Please refresh.';
  });
})();
</script>
