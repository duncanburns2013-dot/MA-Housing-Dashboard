<!-- Agent Sales Map — Squarespace Code Block -->
<!-- Live data from MLSPIN, refreshed weekly via GitHub Pages.            -->
<!-- Replace the entire existing code block in Squarespace with this.     -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
#am-root {
  --navy: #1e335e;
  --cyan: #c9ebfc;
  --gold: #d4af37;
  --coral: #ff7560;
  --bg: #fafbfc;
  --ink: #1e335e;
  --ink-mute: #6b7280;
  --border: #e5e7eb;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--bg);
  border-radius: 16px;
  overflow: hidden;
  max-width: 100%;
  margin: 0 auto;
  border: 1px solid var(--border);
  box-shadow: 0 10px 40px rgba(30,51,94,0.08);
}
#am-root * { box-sizing: border-box; }

/* Header */
#am-root .am-header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
  padding: 28px 32px;
  background: linear-gradient(135deg, var(--navy) 0%, #2a4a82 100%);
  color: #fff;
  position: relative;
  overflow: hidden;
}
#am-root .am-header::before {
  content: ''; position: absolute; top: -100px; right: -100px;
  width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,235,252,0.15) 0%, transparent 60%);
}
#am-root .am-photo {
  width: 80px; height: 80px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 3px solid var(--cyan);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  background-color: #2a4a82;
  position: relative; z-index: 1;
}
#am-root .am-name {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 700; line-height: 1.1;
  margin: 0; color: #fff !important;
  position: relative; z-index: 1;
}
#am-root .am-title {
  font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--cyan) !important; opacity: 0.85; margin-top: 4px;
  position: relative; z-index: 1;
}
#am-root .am-stats {
  display: flex; gap: 24px;
  position: relative; z-index: 1;
}
#am-root .am-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700; line-height: 1; color: #fff !important;
}
#am-root .am-stat-lbl {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cyan) !important; opacity: 0.8; margin-top: 4px;
}

/* Filter bar */
#am-root .am-filters {
  display: flex; gap: 12px; align-items: center;
  padding: 16px 32px; background: #fff;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
#am-root .am-filter-label {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-mute); font-weight: 600;
}
#am-root .am-select {
  appearance: none;
  padding: 8px 32px 8px 12px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  color: var(--ink);
  background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M3 5l3 3 3-3" stroke="%231e335e" stroke-width="1.5" fill="none"/></svg>') no-repeat right 10px center;
  background-size: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: border-color 0.15s;
}
#am-root .am-select:hover, #am-root .am-select:focus {
  border-color: var(--navy); outline: none;
}
#am-root .am-toggle-group {
  display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}
#am-root .am-toggle {
  padding: 8px 14px; font-family: inherit; font-size: 12px; font-weight: 500;
  background: #fff; color: var(--ink-mute); border: none; cursor: pointer;
  transition: all 0.15s;
}
#am-root .am-toggle + .am-toggle { border-left: 1px solid var(--border); }
#am-root .am-toggle:hover { background: #f5f7fa; }
#am-root .am-toggle.active { background: var(--navy); color: #fff; }
#am-root .am-spacer { flex: 1; }
#am-root .am-legend {
  display: flex; gap: 16px; align-items: center;
  font-size: 11px; color: var(--ink-mute);
}
#am-root .am-legend-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
#am-root .am-legend-dot.list { background: var(--gold); box-shadow: 0 0 0 2px rgba(212,175,55,0.2); }
#am-root .am-legend-dot.buy  { background: var(--navy); box-shadow: 0 0 0 2px rgba(30,51,94,0.2); }
#am-root .am-legend-dot.lux  { background: var(--coral); box-shadow: 0 0 0 2px rgba(255,117,96,0.2); }

/* Map */
#am-map { height: 600px; width: 100%; background: #e8eef5; }
#am-root .leaflet-popup-content-wrapper {
  border-radius: 10px; padding: 0; box-shadow: 0 8px 24px rgba(30,51,94,0.18);
}
#am-root .leaflet-popup-content { margin: 0; min-width: 240px; font-family: inherit; }
#am-root .am-pop {
  position: relative;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
}
#am-root .am-pop-header {
  display: grid; grid-template-columns: 44px 1fr;
  gap: 12px; padding: 14px 16px 10px;
  background: linear-gradient(135deg, var(--navy), #2a4a82);
  color: #fff;
}
#am-root .am-pop.lux .am-pop-header {
  background: linear-gradient(135deg, var(--coral), #d4574a);
}
#am-root .am-pop-photo {
  width: 44px; height: 44px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 2px solid var(--cyan); background-color: #2a4a82;
}
#am-root .am-pop-agent {
  font-size: 13px; font-weight: 600; line-height: 1.2;
  color: #fff !important; margin: 0;
}
#am-root .am-pop-side {
  font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--cyan) !important; opacity: 0.9; margin-top: 2px;
}
#am-root .am-pop.lux .am-pop-side { color: #fff !important; }
#am-root .am-pop-body { padding: 12px 16px 14px; }
#am-root .am-pop-addr {
  font-size: 13px; font-weight: 500; line-height: 1.3;
  color: var(--ink); margin-bottom: 6px;
}
#am-root .am-pop-price {
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700; color: var(--ink);
}
#am-root .am-pop.lux .am-pop-price {
  color: var(--coral); text-shadow: 0 0 12px rgba(255,117,96,0.3);
}
#am-root .am-pop-meta {
  font-size: 11px; color: var(--ink-mute); margin-top: 4px;
  display: flex; gap: 10px; flex-wrap: wrap;
}
#am-root .am-pop-link {
  display: inline-block; margin-top: 10px;
  font-size: 11px; color: var(--navy); text-decoration: none;
  border-bottom: 1px solid var(--cyan);
}
#am-root .am-pop-link:hover { color: var(--coral); }

/* Custom marker (SVG-based circle) */
.am-pin {
  display: block; border-radius: 50%;
  background: var(--c, #1e335e);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.am-pin:hover {
  transform: scale(1.3);
}
.am-pin.lux:hover {
  box-shadow: 0 0 0 6px rgba(255,117,96,0.3), 0 0 16px rgba(255,117,96,0.5);
}
.am-cluster {
  background: rgba(30,51,94,0.85);
  color: #fff;
  border-radius: 50%;
  border: 2px solid var(--cyan, #c9ebfc);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

/* Footer */
#am-root .am-foot {
  padding: 14px 32px; background: #fff;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--ink-mute);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
#am-root .am-foot a { color: var(--navy); text-decoration: none; }
#am-root .am-foot a:hover { color: var(--coral); }
#am-root .am-loading {
  display: flex; align-items: center; justify-content: center;
  height: 600px; color: var(--ink-mute); font-size: 14px;
  background: #f0f4f9;
}

@media (max-width: 768px) {
  #am-root .am-header { grid-template-columns: 64px 1fr; padding: 20px; gap: 16px; }
  #am-root .am-photo { width: 64px; height: 64px; }
  #am-root .am-name { font-size: 22px; }
  #am-root .am-stats { grid-column: 1 / -1; gap: 14px; margin-top: 8px; }
  #am-root .am-stat-val { font-size: 18px; }
  #am-root .am-filters { padding: 14px 20px; }
  #am-root .am-legend { display: none; }
  #am-map { height: 480px; }
  #am-root .am-foot { padding: 12px 20px; font-size: 10px; }
}
</style>

<div id="am-root">
  <div class="am-header">
    <div class="am-photo" id="am-photo"></div>
    <div>
      <div class="am-title" id="am-title">REALTOR®</div>
      <h2 class="am-name" id="am-name">Loading…</h2>
    </div>
    <div class="am-stats" id="am-stats"></div>
  </div>

  <div class="am-filters">
    <span class="am-filter-label">Year</span>
    <select class="am-select" id="am-year"><option value="all">All Years</option></select>
    <span class="am-filter-label" style="margin-left:8px">Side</span>
    <div class="am-toggle-group">
      <button class="am-toggle active" data-side="all">All</button>
      <button class="am-toggle" data-side="list">Sell</button>
      <button class="am-toggle" data-side="buy">Buy</button>
    </div>
    <div class="am-spacer"></div>
    <div class="am-legend">
      <span><span class="am-legend-dot list"></span>Sell-side</span>
      <span><span class="am-legend-dot buy"></span>Buy-side</span>
      <span><span class="am-legend-dot lux"></span>$1M+</span>
    </div>
  </div>

  <div id="am-map" class="am-loading">Loading map…</div>

  <div class="am-foot">
    <div>Data: MLSPIN · <span id="am-foot-stamp">Updated weekly</span></div>
    <div><span id="am-foot-counts"></span></div>
  </div>
</div>

<script>
(function(){
var DATA_URL = 'https://duncanburns2013-dot.github.io/MA-Housing-Dashboard/data/processed/agent-map.json';
var REPO_BASE = 'https://duncanburns2013-dot.github.io/MA-Housing-Dashboard/';

function fmtMoney(v) {
  if (v == null) return '—';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  return '$' + Math.round(v/1000) + 'K';
}
function fmtMoneyFull(v) {
  return '$' + Math.round(v).toLocaleString();
}
function fmtDate(s) {
  var d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}
function priceToRadius(p) {
  // Min 7px, max 18px. Scales by log of price.
  if (!p) return 8;
  var min = 7, max = 18;
  var t = Math.max(0, Math.min(1, (Math.log10(p) - 5.0) / 2.0)); // $100K to $10M range
  return Math.round(min + (max - min) * t);
}

var state = {
  data: null,
  filterYear: 'all',
  filterSide: 'all',
  map: null,
  cluster: null
};

function getAgent(id) {
  return state.data.agents.find(function(a){ return a.mlsId === id; });
}

function filteredSales() {
  return state.data.sales.filter(function(s) {
    if (state.filterYear !== 'all' && s.year !== state.filterYear) return false;
    if (state.filterSide !== 'all' && s.side !== state.filterSide) return false;
    return true;
  });
}

function renderHeader() {
  // For test run, single agent — header reflects that agent.
  // Multi-agent UX deferred to a later iteration.
  var a = state.data.agents[0];
  if (!a) return;
  var photoUrl = a.photoUrl.indexOf('http') === 0 ? a.photoUrl : REPO_BASE + a.photoUrl;
  document.getElementById('am-photo').style.backgroundImage = 'url("' + photoUrl + '")';
  document.getElementById('am-name').textContent = a.name;
  document.getElementById('am-title').textContent = a.title || 'REALTOR®';

  var filtered = filteredSales();
  var total = filtered.reduce(function(s,x){ return s + (x.price || 0); }, 0);
  var listCount = filtered.filter(function(x){return x.side === 'list'}).length;
  var buyCount = filtered.filter(function(x){return x.side === 'buy'}).length;
  document.getElementById('am-stats').innerHTML =
    '<div><div class="am-stat-val">' + filtered.length + '</div><div class="am-stat-lbl">Sales</div></div>' +
    '<div><div class="am-stat-val">' + fmtMoney(total) + '</div><div class="am-stat-lbl">Volume</div></div>' +
    '<div><div class="am-stat-val">' + listCount + '/' + buyCount + '</div><div class="am-stat-lbl">Sell / Buy</div></div>';
}

function renderPopup(s) {
  var a = getAgent(s.agentId);
  var photoUrl = a && a.photoUrl ? (a.photoUrl.indexOf('http') === 0 ? a.photoUrl : REPO_BASE + a.photoUrl) : '';
  var isLux = s.price >= 1000000;
  var sideLabel = s.side === 'list' ? 'Sell-side' : 'Buy-side';
  var meta = [];
  if (s.beds) meta.push(s.beds + ' bd');
  if (s.baths) meta.push(s.baths + ' ba');
  if (s.sqft) meta.push(s.sqft.toLocaleString() + ' sqft');
  if (s.subType) meta.push(s.subType);
  var mapsLink = 'https://www.google.com/maps?q=' + encodeURIComponent(s.address);

  return '<div class="am-pop' + (isLux ? ' lux' : '') + '">' +
    '<div class="am-pop-header">' +
      '<div class="am-pop-photo" style="background-image:url(\'' + photoUrl + '\')"></div>' +
      '<div>' +
        '<div class="am-pop-agent">' + (a ? a.name : 'Agent') + '</div>' +
        '<div class="am-pop-side">' + sideLabel + (isLux ? ' · Luxury' : '') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="am-pop-body">' +
      '<div class="am-pop-addr">' + s.address + '</div>' +
      '<div class="am-pop-price">' + fmtMoneyFull(s.price) + '</div>' +
      (meta.length ? '<div class="am-pop-meta"><span>' + fmtDate(s.date) + '</span>' + meta.map(function(m){return '<span>·</span><span>' + m + '</span>'}).join('') + '</div>' : '<div class="am-pop-meta">' + fmtDate(s.date) + '</div>') +
      '<a class="am-pop-link" href="' + mapsLink + '" target="_blank" rel="noopener">Open in Google Maps →</a>' +
    '</div>' +
  '</div>';
}

function renderMap() {
  if (!state.map) {
    document.getElementById('am-map').classList.remove('am-loading');
    document.getElementById('am-map').innerHTML = '';
    state.map = L.map('am-map', { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(state.map);
    state.cluster = L.markerClusterGroup({
      iconCreateFunction: function(cluster) {
        var n = cluster.getChildCount();
        var size = n < 10 ? 36 : n < 50 ? 44 : 52;
        return L.divIcon({
          html: '<div class="am-cluster" style="width:' + size + 'px;height:' + size + 'px">' + n + '</div>',
          className: '',
          iconSize: L.point(size, size)
        });
      }
    });
    state.map.addLayer(state.cluster);
  }
  state.cluster.clearLayers();

  var sales = filteredSales().filter(function(s){ return s.lat && s.lng; });
  if (!sales.length) {
    state.map.setView([42.81, -70.87], 11);
    return;
  }

  var bounds = L.latLngBounds([]);
  sales.forEach(function(s) {
    var isLux = s.price >= 1000000;
    var color = s.side === 'list' ? '#d4af37' : '#1e335e';
    var r = priceToRadius(s.price);
    var icon = L.divIcon({
      html: '<span class="am-pin' + (isLux ? ' lux' : '') + '" style="width:' + (r*2) + 'px;height:' + (r*2) + 'px;--c:' + color + '"></span>',
      className: '',
      iconSize: [r*2, r*2],
      iconAnchor: [r, r]
    });
    var m = L.marker([s.lat, s.lng], { icon: icon });
    m.bindPopup(renderPopup(s), { closeButton: true, maxWidth: 320 });
    state.cluster.addLayer(m);
    bounds.extend([s.lat, s.lng]);
  });
  state.map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
}

function renderFooter() {
  if (state.data.meta.generated) {
    var stamp = new Date(state.data.meta.generated).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    document.getElementById('am-foot-stamp').textContent = 'Updated ' + stamp;
  }
  var sales = filteredSales();
  var missing = state.data.meta.missingGeocode || 0;
  var withGeo = sales.filter(function(s){return s.lat && s.lng}).length;
  var note = withGeo + ' of ' + sales.length + ' shown on map';
  if (missing > 0) note += ' · ' + missing + ' total without coordinates';
  document.getElementById('am-foot-counts').textContent = note;
}

function setupFilters() {
  var yearSel = document.getElementById('am-year');
  state.data.meta.years.forEach(function(y) {
    var opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  });
  yearSel.addEventListener('change', function() {
    state.filterYear = yearSel.value;
    renderHeader(); renderMap(); renderFooter();
  });
  document.querySelectorAll('.am-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.am-toggle').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.filterSide = btn.dataset.side;
      renderHeader(); renderMap(); renderFooter();
    });
  });
}

fetch(DATA_URL + '?t=' + Date.now())
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(data) {
    state.data = data;
    if (data.brand && data.brand.primary) {
      document.getElementById('am-root').style.setProperty('--navy', data.brand.primary);
      document.getElementById('am-root').style.setProperty('--cyan', data.brand.accent);
    }
    setupFilters();
    renderHeader();
    renderMap();
    renderFooter();
  })
  .catch(function(e) {
    console.error('Agent map fetch failed:', e);
    document.getElementById('am-name').textContent = 'Map unavailable';
    document.getElementById('am-map').textContent = 'Live data could not load. Please refresh.';
  });
})();
</script>
